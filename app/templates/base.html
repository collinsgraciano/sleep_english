<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听力视频生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
<div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col">
        <div class="p-4 border-b border-slate-700">
            <h1 class="text-lg font-bold text-white">😴 Sleep English</h1>
            <p class="text-xs text-slate-400 mt-1">睡觉听 · AB 短句循环</p>
        </div>
        <nav class="flex-1 p-3 space-y-1">
            <a href="/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'dashboard' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">🏠</span> 控制台
            </a>
            <a href="/sleep" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'sleep' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">😴</span> Sleep 睡前短句
            </a>
            <a href="/arrangement" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'arrangement' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">📋</span> 内容编排
            </a>
            <a href="/config" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'config' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">⚙️</span> 参数配置
            </a>
            <a href="/topics" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'topics' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">📚</span> 主题管理
            </a>
            <a href="/scripts" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'scripts' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">📝</span> 批量脚本
            </a>
            <a href="/runs" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'runs' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">📁</span> 运行历史
            </a>
            <a href="/voices" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'voices' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">🎤</span> QwenTTS 音色
            </a>
            <a href="/moss_voices" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'moss_voices' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">🔊</span> MOSS 音色
            </a>
            <a href="/kokoro_voices" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'kokoro_voices' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">🎵</span> Kokoro 音色
            </a>
            <a href="/channel_factory" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'channel_factory' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">📺</span> 频道工坊
            </a>
            <a href="/channels" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'channels' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">🎞️</span> 频道矩阵
            </a>
            <a href="/workspace" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'workspace' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">🪟</span> 多频道工作台
            </a>
            <a href="/intro_videos" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'intro_videos' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">🌙</span> 片头库
            </a>
            <a href="/outro_videos" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'outro_videos' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">🎬</span> 片尾库
            </a>
            <a href="/ai_test" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm
                {% if active_page == 'ai_test' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
                <span class="text-lg">🧪</span> AI 对话测试
            </a>
        </nav>
        <div class="p-3 border-t border-slate-700">
            <a href="/api/health" target="_blank" class="block text-xs text-slate-500 hover:text-slate-300">
                检查服务状态
            </a>
        </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-x-clip">
        <!-- 频道上下文条：上下文 = URL ?channel= 参数（每个标签页独立，
             多开互不干扰）；切换 = 当前路径增删 channel 参数跳转 -->
        <div id="ctx-bar" class="hidden sticky top-0 z-40 bg-slate-800/95 backdrop-blur border-b border-slate-700 px-6 py-2 flex items-center gap-3">
            <span class="text-xs text-slate-400 shrink-0">🎞️ 当前上下文</span>
            <select id="ctx-channel" onchange="switchCtxChannel(this.value)"
                class="bg-slate-900 border border-slate-600 rounded-lg px-2 py-1 text-xs text-white min-w-[220px]">
                <option value="">🏠 默认全局配置</option>
            </select>
            <span id="ctx-hint" class="text-[11px] text-slate-500 truncate">选中频道后，本标签页内控制台/参数配置/主题管理/片头库等页面均读写该频道独立配置</span>
        </div>
        {% block content %}{% endblock %}
    </main>
</div>

<script>
// 频道上下文（URL 事实源）：读取 ?channel=、渲染上下文条、改写侧边栏
// 链接使其携带 channel —— 每个标签页独立频道，可多开并行操作
(function () {
    const params = new URLSearchParams(location.search);
    const cur = params.get('channel') || '';
    const bar = document.getElementById('ctx-bar');

    function withChannel(url) {
        const u = new URL(url, location.origin);
        if (cur) u.searchParams.set('channel', cur);
        else u.searchParams.delete('channel');
        return u.pathname + (u.search ? u.search : '') + u.hash;
    }

    // 侧边栏 + 页面内所有内部链接保持频道上下文（URL ?channel= 事实源）：
    // 排除 API/静态资源/外链/协议相对/锚点；无上下文时不改写（零行为变化）
    if (cur) {
        document.querySelectorAll('a[href]').forEach(a => {
            const href = a.getAttribute('href') || '';
            if (!href.startsWith('/') || href.startsWith('//')) return;
            if (href.startsWith('/api/') || href.startsWith('/static/')) return;
            a.href = withChannel(href);
        });
    }

    // 多频道工作台的 iframe 里点侧边栏「多频道工作台」→ 顶层跳转，避免工作台嵌套
    if (window.self !== window.top) {
        const wsLink = document.querySelector('aside a[href^="/workspace"]');
        if (wsLink) wsLink.target = '_top';
    }

    fetch('/api/channels/context').then(r => r.json()).then(d => {
        const channels = d.channels || [];
        if (!bar) return;
        if (!channels.length && !cur) return;
        const sel = document.getElementById('ctx-channel');
        channels.forEach(c => {
            const o = document.createElement('option');
            o.value = c.id;
            o.textContent = '🎞️ ' + c.name_en + (c.status !== 'active' ? '（paused）' : '');
            sel.appendChild(o);
        });
        sel.value = cur;
        bar.classList.remove('hidden');
        const hint = document.getElementById('ctx-hint');
        if (cur) {
            const cc = channels.find(c => c.id === cur);
            hint.textContent = '⚠ 本标签页正在编辑频道「' + (cc ? cc.name_en : cur) + '」的独立配置 —— 保存写回频道，不影响全局；其它标签页可操作别的频道';
            hint.className = 'text-[11px] text-amber-300 truncate';
        }
    }).catch(() => {});
})();
function switchCtxChannel(cid) {
    const u = new URL(location.href);
    if (cid) u.searchParams.set('channel', cid);
    else u.searchParams.delete('channel');
    location.href = u.pathname + (u.search ? u.search : '') + u.hash;
}
</script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
