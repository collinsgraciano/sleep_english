{# 共享 partial：配置表单 JS（config.html 与 sleep_config.html 共用）。
   依赖服务端注入：mode / custom_providers / params / sleep_color_defaults。 #}
<script>
const MODE = {{ mode | tojson }};  // 当前编辑的模式 Tab（structure 恒等于它）
const CUSTOM_PROVIDERS = {{ custom_providers | tojson }};  // [{id, name, models[]}]
const OPENAI_MODEL_OPTIONS = {{ params.openai_model.options | tojson }};
const SLEEP_COLOR_DEFAULTS = {{ sleep_color_defaults | tojson }};  // sleep_color_* 留空时的内置默认色

function toggleSection(btn) {
    const content = btn.nextElementSibling;
    const icon = btn.querySelector('.toggle-icon');
    if (content.style.display === 'none') {
        content.style.display = '';
        icon.style.transform = '';
    } else {
        content.style.display = 'none';
        icon.style.transform = 'rotate(-90deg)';
    }
}

function toggleLLMFields(provider) {
    const showOpenAI = provider !== 'sensenova' && provider !== 'gemini';
    document.querySelectorAll('.config-field').forEach(f => {
        const field = f.querySelector('[data-field]');
        if (!field) return;
        const key = field.getAttribute('data-field');
        if (key.startsWith('sensenova_')) {
            f.style.display = provider === 'sensenova' ? '' : 'none';
        }
        if (key.startsWith('gemini_')) {
            f.style.display = provider === 'gemini' ? '' : 'none';
        }
        if (key.startsWith('openai_')) {
            f.style.display = showOpenAI ? '' : 'none';
        }
    });
    updateModelOptions(provider);
}

// 自定义 Provider 时，模型下拉切换为该 Provider 自己的模型列表
function updateModelOptions(provider) {
    const modelSel = document.querySelector('[data-field="openai_model"]');
    if (!modelSel) return;
    const saved = modelSel.value;
    let models = OPENAI_MODEL_OPTIONS;
    let label = 'OpenAI Model';
    if (provider && provider.startsWith('custom:')) {
        const pid = provider.split(':')[1];
        const cp = CUSTOM_PROVIDERS.find(p => p.id === pid);
        if (cp) {
            models = cp.models || [];
            label = `模型 (${cp.name})`;
        }
    }
    modelSel.innerHTML = '';
    models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modelSel.appendChild(opt);
    });
    if (models.includes(saved)) {
        modelSel.value = saved;
    } else if (models.length) {
        modelSel.value = models[0];
    }
    const labelEl = modelSel.closest('.config-field')?.querySelector('label');
    if (labelEl) labelEl.textContent = label;
}

function toggleTTSFields(engine) {
    const qwenFields = ['qwen_model_path', 'qwen_base_model_path', 'qwen_voicedesign_model_path', 'qwen_device'];
    const mossFields = ['moss_model_path', 'moss_tokenizer_path', 'moss_device', 'moss_repo_dir'];
    document.querySelectorAll('.config-field').forEach(f => {
        const field = f.querySelector('[data-field]');
        if (!field) return;
        const key = field.getAttribute('data-field');
        if (qwenFields.includes(key)) {
            f.style.display = (engine === 'qwen') ? '' : 'none';
        } else if (mossFields.includes(key)) {
            f.style.display = (engine === 'moss') ? '' : 'none';
        }
    });
}

// BGM 分组按混音模式显隐（隐藏卡片内字段仍参与保存）
function toggleBGMGroups(mode) {
    const amixCard = document.getElementById('group-card-bgm_amix');
    const scCard = document.getElementById('group-card-bgm_sidechain');
    if (amixCard) amixCard.style.display = (mode === 'amix') ? '' : 'none';
    if (scCard) scCard.style.display = (mode === 'sidechain' || mode === 'sidechain_adaptive') ? '' : 'none';
}

function collectConfig() {
    const config = {};
    document.querySelectorAll('[data-field]').forEach(el => {
        const key = el.getAttribute('data-field');
        if (el.type === 'checkbox') {
            config[key] = el.checked;
        } else if (el.type === 'number') {
            config[key] = el.value === '' ? '' : parseFloat(el.value);
        } else {
            config[key] = el.value;
        }
    });
    return config;
}

// 强制 structure = 当前 Tab 模式（预设/默认值可能带来其它模式的 structure）
function forceStructureMode() {
    const hidden = document.querySelector('[data-field="structure"]');
    if (hidden) hidden.value = MODE;
}

function fillForm(config) {
    document.querySelectorAll('[data-field]').forEach(el => {
        const key = el.getAttribute('data-field');
        if (key in config) {
            if (el.type === 'checkbox') {
                el.checked = config[key];
            } else {
                el.value = config[key];
            }
        }
    });
    forceStructureMode();
    // Trigger conditional displays
    toggleLLMFields(config.llm_provider || 'sensenova');
    toggleTTSFields(config.tts_engine || 'kokoro');
    toggleBGMGroups(config.bgm_ducking_mode || 'sidechain');
    initSleepColorInputs();
    scheduleSleepPreview();
    if (typeof onSequenceConfigRefresh === 'function') onSequenceConfigRefresh();
}

function saveConfig() {
    const config = collectConfig();
    fetch('/api/config/save_all', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({...config, _mode: MODE})
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            const indicator = document.getElementById('save-indicator');
            indicator.classList.remove('hidden');
            setTimeout(() => indicator.classList.add('hidden'), 2000);
        }
    });
}

function saveAsPreset() {
    const name = prompt('预设名称:');
    if (!name) return;
    const config = collectConfig();
    fetch('/api/config/preset/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, config})
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            // Refresh preset list
            location.reload();
        }
    });
}

function loadPreset(name) {
    if (!name) return;
    fetch('/api/config/preset/load/' + name)
        .then(r => r.json())
        .then(config => {
            fillForm(config);
        });
}

function deletePreset(name) {
    if (!confirm('删除预设 "' + name + '"?')) return;
    fetch('/api/config/preset/' + name, {method: 'DELETE'})
        .then(() => location.reload());
}

function resetConfig() {
    if (!confirm('恢复所有参数为默认值?')) return;
    fetch('/api/config/defaults')
        .then(r => r.json())
        .then(config => fillForm(config));
}

function detectMCPToken() {
    fetch('/api/mcp/detect_token')
        .then(r => r.json())
        .then(data => {
            if (data.ok) {
                const ta = document.querySelector('[data-field="mcp_tokens"]');
                const existing = ta.value.trim();
                if (existing && !existing.includes(data.token)) {
                    ta.value = existing + '\n' + data.token;
                } else if (!existing) {
                    ta.value = data.token;
                } else {
                    alert('Token 已存在');
                }
            } else {
                alert(data.error || '未检测到');
            }
        });
}

// --- Sleep 组：色盘 ↔ hex 双向同步 + 实时预览（成片卡片真实渲染） ---
function _isValidHex(v) {
    return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test((v || '').trim());
}

// 色盘初值 = 已填 hex（有效时），否则显示该槽位内置默认色
function initSleepColorInputs() {
    document.querySelectorAll('input[data-colorof]').forEach(sw => {
        const key = sw.getAttribute('data-colorof');
        const txt = document.querySelector('[data-field="' + key + '"]');
        if (!txt) return;
        const v = (txt.value || '').trim();
        sw.value = _isValidHex(v) ? v : (SLEEP_COLOR_DEFAULTS[key] || '#888888');
    });
}

function onSleepColorSwatch(sw) {
    const key = sw.getAttribute('data-colorof');
    const txt = document.querySelector('[data-field="' + key + '"]');
    if (txt) txt.value = sw.value;
    scheduleSleepPreview();
}

function resetSleepColor(key) {
    const txt = document.querySelector('[data-field="' + key + '"]');
    const sw = document.querySelector('[data-colorof="' + key + '"]');
    if (txt) {
        txt.value = '';
        txt.dispatchEvent(new Event('change', {bubbles: true}));  // 触发自动保存
    }
    if (sw) sw.value = SLEEP_COLOR_DEFAULTS[key] || '#888888';
    scheduleSleepPreview();
}

// --- Sleep 随机配色 / 配色组合（configs/sleep_color_presets/，后端只存取） ---
const SLEEP_COLOR_KEYS = Object.keys(SLEEP_COLOR_DEFAULTS);

function _hslToHex(h, s, l) {  // h:0-360, s/l:0-100 → '#rrggbb'
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const to255 = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return '#' + to255(f(0)) + to255(f(8)) + to255(f(4));
}

const _rnd = (lo, hi) => lo + Math.random() * (hi - lo);

// 完全随机：约一半浅色系（柔和底+白卡）、一半深色系（深底+亮字）；
// 同族槽位共享基础色相，点缀槽位（en_b/num/badge_bg）跳色相撞色，保证可读性对比度
function _randomSleepPalette() {
    const dark = Math.random() < 0.5;
    const h = _rnd(0, 360);
    const acc = (h + (Math.random() < 0.5 ? _rnd(120, 180) : -_rnd(120, 180)) + 360) % 360;
    const leaf = (h + _rnd(-40, 40) + 360) % 360;
    if (dark) {
        return {
            sleep_color_bg_top: _hslToHex(h, _rnd(35, 65), _rnd(9, 13)),
            sleep_color_bg_bottom: _hslToHex(h, _rnd(40, 70), _rnd(13, 18)),
            sleep_color_card: _hslToHex(h, _rnd(25, 45), _rnd(11, 16)),
            sleep_color_card_border: _hslToHex(h, _rnd(35, 60), _rnd(38, 50)),
            sleep_color_en_a: _hslToHex(h, _rnd(55, 80), _rnd(82, 90)),
            sleep_color_en_b: _hslToHex(acc, _rnd(70, 90), _rnd(68, 78)),
            sleep_color_phonetic: _hslToHex(h, _rnd(25, 40), _rnd(62, 72)),
            sleep_color_zh: _hslToHex(h, _rnd(10, 25), _rnd(78, 86)),
            sleep_color_num: _hslToHex(acc, _rnd(75, 95), _rnd(70, 80)),
            sleep_color_badge_bg: _hslToHex(acc, _rnd(65, 90), _rnd(45, 58)),
            sleep_color_badge_text: _hslToHex(h, _rnd(10, 25), _rnd(92, 97)),
            sleep_color_channel: _hslToHex(leaf, _rnd(40, 60), _rnd(68, 78)),
            sleep_color_leaf: _hslToHex(leaf, _rnd(35, 55), _rnd(55, 65)),
        };
    }
    return {
        sleep_color_bg_top: _hslToHex(h, _rnd(45, 70), _rnd(88, 93)),
        sleep_color_bg_bottom: _hslToHex(h, _rnd(50, 75), _rnd(82, 87)),
        sleep_color_card: _hslToHex(h, _rnd(15, 35), _rnd(97, 99)),
        sleep_color_card_border: _hslToHex(h, _rnd(30, 50), _rnd(62, 72)),
        sleep_color_en_a: _hslToHex(h, _rnd(45, 75), _rnd(14, 22)),
        sleep_color_en_b: _hslToHex(acc, _rnd(75, 95), _rnd(42, 52)),
        sleep_color_phonetic: _hslToHex(h, _rnd(35, 55), _rnd(42, 52)),
        sleep_color_zh: _hslToHex(h, _rnd(8, 20), _rnd(20, 30)),
        sleep_color_num: _hslToHex(acc, _rnd(80, 100), _rnd(58, 68)),
        sleep_color_badge_bg: _hslToHex(acc, _rnd(65, 90), _rnd(75, 84)),
        sleep_color_badge_text: '#ffffff',
        sleep_color_channel: _hslToHex(leaf, _rnd(30, 50), _rnd(28, 40)),
        sleep_color_leaf: _hslToHex(leaf, _rnd(45, 70), _rnd(82, 90)),
    };
}

// 填字段 + 同步色盘 + 触发 change（走现有 1s 防抖自动保存）+ 刷新预览
function _applySleepColors(colors) {
    Object.entries(colors).forEach(([key, val]) => {
        if (!SLEEP_COLOR_KEYS.includes(key)) return;
        const txt = document.querySelector('[data-field="' + key + '"]');
        if (!txt) return;
        txt.value = String(val);
        txt.dispatchEvent(new Event('change', {bubbles: true}));
        const sw = document.querySelector('[data-colorof="' + key + '"]');
        if (sw && _isValidHex(txt.value)) sw.value = txt.value.trim();
    });
    scheduleSleepPreview();
}

function randomSleepPalette() {
    _applySleepColors(_randomSleepPalette());
}

let _sleepColorCombos = [];

function loadSleepColorCombos() {
    return fetch('/api/config/sleep_colors')
        .then(r => r.json())
        .then(data => {
            _sleepColorCombos = data.combos || [];
            const sel = document.getElementById('sleep-color-combo-select');
            if (!sel) return;
            const cur = sel.value;
            sel.innerHTML = '';
            const opt0 = document.createElement('option');
            opt0.value = '';
            opt0.textContent = '载入配色...';
            sel.appendChild(opt0);
            _sleepColorCombos.forEach(c => {
                const o = document.createElement('option');
                o.value = c.name;
                o.textContent = c.name;
                sel.appendChild(o);
            });
            if (_sleepColorCombos.some(c => c.name === cur)) sel.value = cur;
        }).catch(() => {});
}

function _collectSleepColors() {
    const colors = {};
    SLEEP_COLOR_KEYS.forEach(k => {
        const el = document.querySelector('[data-field="' + k + '"]');
        if (el && (el.value || '').trim()) colors[k] = el.value.trim();
    });
    return colors;
}

function saveSleepColorCombo() {
    const colors = _collectSleepColors();
    if (!Object.keys(colors).length) {
        alert('当前没有已填写的配色（全部为内置默认），先随机或手动填色后再保存');
        return;
    }
    const name = prompt('配色组合名称:');
    if (!name) return;
    if (_sleepColorCombos.some(c => c.name === name) && !confirm('配色「' + name + '」已存在，覆盖?')) return;
    fetch('/api/config/sleep_colors', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, colors})
    }).then(r => r.json()).then(data => {
        if (data.ok) loadSleepColorCombos();
        else alert(data.error || '保存失败');
    }).catch(() => alert('保存失败'));
}

function applySleepColorComboFromSelect(sel) {
    if (!sel.value) return;
    const combo = _sleepColorCombos.find(c => c.name === sel.value);
    if (!combo) return;
    _applySleepColors(combo.colors || {});
}

function deleteSleepColorCombo() {
    const sel = document.getElementById('sleep-color-combo-select');
    if (!sel || !sel.value) { alert('先在下拉中选中要删除的配色组合'); return; }
    const combo = _sleepColorCombos.find(c => c.name === sel.value);
    if (!combo) return;
    if (!confirm('删除配色「' + combo.name + '」?')) return;
    fetch('/api/config/sleep_colors/' + encodeURIComponent(combo.name), {method: 'DELETE'})
        .then(r => r.json())
        .then(() => loadSleepColorCombos());
}

let _sleepPreviewTimer = null;
let _sleepPreviewBusy = false;
let _sleepPreviewDirty = false;

function scheduleSleepPreview() {
    if (!document.getElementById('sleep-preview-img')) return;
    clearTimeout(_sleepPreviewTimer);
    _sleepPreviewTimer = setTimeout(refreshSleepPreview, 350);
}

function _collectSleepFields() {
    const payload = {};
    document.querySelectorAll('[data-field]').forEach(el => {
        const key = el.getAttribute('data-field');
        if (key && key.startsWith('sleep_')) {
            payload[key] = (el.type === 'checkbox') ? el.checked : el.value;
        }
    });
    return payload;
}

function refreshSleepPreview() {
    const img = document.getElementById('sleep-preview-img');
    const loading = document.getElementById('sleep-preview-loading');
    if (!img) return;
    if (_sleepPreviewBusy) { _sleepPreviewDirty = true; return; }
    _sleepPreviewBusy = true;
    if (loading) loading.style.display = '';
    fetch('/api/config/sleep_preview', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(_collectSleepFields())
    }).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
    }).then(blob => {
        if (img.dataset.blobUrl) URL.revokeObjectURL(img.dataset.blobUrl);
        const url = URL.createObjectURL(blob);
        img.dataset.blobUrl = url;
        img.src = url;
        img.classList.remove('hidden');
    }).catch(() => {}).finally(() => {
        _sleepPreviewBusy = false;
        if (loading) loading.style.display = 'none';
        if (_sleepPreviewDirty) { _sleepPreviewDirty = false; scheduleSleepPreview(); }
    });
}

// Sleep 组字段 input 实时联动：hex→色盘同步 + 预览刷新（自动保存仍走 change 事件）
document.addEventListener('input', function(e) {
    const el = e.target;
    if (!el || !el.hasAttribute) return;
    if (el.type === 'color' && el.hasAttribute('data-colorof')) {
        onSleepColorSwatch(el);
        return;
    }
    const key = el.getAttribute('data-field');
    if (!key) return;
    if (key.startsWith('sleep_color_')) {
        const sw = document.querySelector('[data-colorof="' + key + '"]');
        if (sw && _isValidHex(el.value)) sw.value = el.value.trim();
    }
    if (key.startsWith('sleep_')) scheduleSleepPreview();
});

// Initialize conditional displays on load
window.addEventListener('load', function() {
    const config = {{ config | tojson }};
    forceStructureMode();
    toggleLLMFields(config.llm_provider || 'sensenova');
    toggleTTSFields(config.tts_engine || 'kokoro');
    toggleBGMGroups(config.bgm_ducking_mode || 'sidechain');
    initSleepColorInputs();
    loadSleepColorCombos();
    refreshSleepPreview();
});

// Auto-save on change (debounced)
let saveTimer = null;
document.addEventListener('change', function(e) {
    if (e.target.hasAttribute('data-field')) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveConfig, 1000);
    }
});
</script>
